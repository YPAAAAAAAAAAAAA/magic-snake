<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>magic-snake</title><link rel="stylesheet" href="snake.css"><link rel="prefetch" href="LICENSE.txt"></head>
<body><main id="stage"><canvas id="canvas" aria-label="3D magic snake. Drag to orbit; tap a piece to twist its joint."></canvas></main>
<button id="toggle" aria-label="Open controls" aria-expanded="false">☰</button>
<section id="panel" hidden><header><strong>magic-snake</strong><span>24 pieces. Endless possibilities.</span></header><p>Drag to orbit · Tap a piece to twist.<br>Each tap turns the following pieces 90°.</p><div class="row"><select id="preset" aria-label="Shape preset"><option value="ribbon">Ribbon</option><option value="wave">Wave</option><option value="wand">Wand</option><option value="coil">Coil</option></select><button id="spin">Auto orbit</button></div><div class="row"><button id="undo">Undo</button><button id="reverse">Twist −90°</button><button id="play">Play folds</button></div><label for="joint">Joint <output id="jointLabel">12 / 23</output></label><input id="joint" type="range" min="1" max="23" value="12"><div class="row"><button id="twist">Twist +90°</button><button id="reset">Reset view</button></div><label for="code">Shape code · copy to share</label><div class="row"><input id="code" type="text" maxlength="23" spellcheck="false" aria-label="Shape code"><button id="load">Load</button></div><p id="status" role="status">Ready to fold.</p><footer>idea after @regomne (regomne/magic-snake); clean-room implementation, no code copied</footer></section>
<script src="snake.js"></script></body></html>
